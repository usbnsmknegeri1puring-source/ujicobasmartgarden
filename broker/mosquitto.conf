# ==============================================================================
# SMART GARDEN IoT - MOSQUITTO BROKER CONFIGURATION (mosquitto.conf)
# Sesuai Bagian 4, 5, dan 6 ujicoba.md
# ==============================================================================

# Penyimpanan dan Persistence
persistence true
persistence_location ./data/

# Logging
log_dest stdout
log_dest file ./mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# ------------------------------------------------------------------------------
# LISTENER 1: Standard MQTT TCP Port (Untuk ESP32 dan Backend)
# ------------------------------------------------------------------------------
listener 1883
protocol mqtt
allow_anonymous true

# ------------------------------------------------------------------------------
# LISTENER 2: MQTT over WebSocket Port (Untuk Dashboard Browser Website)
# ------------------------------------------------------------------------------
listener 9001
protocol websockets
allow_anonymous true

# Catatan Keamanan Produksi:
# Untuk deployment produksi, nonaktifkan allow_anonymous dan gunakan password file:
# allow_anonymous false
# password_file /etc/mosquitto/passwd
#
# Serta aktifkan sertifikat SSL/TLS untuk proteksi enkripsi data sensor dan kontrol.
